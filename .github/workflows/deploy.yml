name: Deploy to EC2

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_COGNITO_DOMAIN="${{ secrets.NEXT_PUBLIC_COGNITO_DOMAIN }}" \
            --build-arg NEXT_PUBLIC_COGNITO_CLIENT_ID="${{ secrets.NEXT_PUBLIC_COGNITO_CLIENT_ID }}" \
            --build-arg NEXT_PUBLIC_COGNITO_REDIRECT_URI="${{ secrets.NEXT_PUBLIC_COGNITO_REDIRECT_URI }}" \
            --build-arg NEXT_PUBLIC_COGNITO_SCOPES="${{ secrets.NEXT_PUBLIC_COGNITO_SCOPES }}" \
            --build-arg NEXT_PUBLIC_COGNITO_LOGOUT_URI="${{ secrets.NEXT_PUBLIC_COGNITO_LOGOUT_URI }}" \
            -t xdranz/cognito-next-test .
          docker push xdranz/cognito-next-test

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/infra
            docker pull xdranz/cognito-next-test
            docker compose up -d
